<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>JobPilot</title>
<style>
:root{--bg:#0a0c14;--panel:#12162299;--card:#161b2b;--line:#252c44;--tx:#e8ebf5;--mut:#8b93b0;--acc:#7c8cff;--acc2:#b06cff;--ok:#34d399;--warn:#fbbf24;--bad:#f87171}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(1200px 600px at 10% -10%,#1d2250 0,transparent 60%),radial-gradient(900px 500px at 100% 0,#3a1a58 0,transparent 55%),var(--bg);color:var(--tx);font:14px/1.5 Inter,"Segoe UI",system-ui,sans-serif;min-height:100vh}
.app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
nav{padding:22px 14px;border-right:1px solid var(--line);background:#0b0e1acc;position:sticky;top:0;height:100vh}
.logo{font-weight:800;font-size:20px;margin:0 8px 22px;background:linear-gradient(90deg,var(--acc),var(--acc2));-webkit-background-clip:text;color:transparent}
nav button{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:none;border:0;color:var(--mut);padding:10px 12px;border-radius:10px;font:inherit;cursor:pointer;margin-bottom:4px}
nav button:hover{background:#ffffff0a;color:var(--tx)}nav button.on{background:linear-gradient(90deg,#7c8cff30,#b06cff18);color:var(--tx)}
main{padding:28px 34px;max-width:1400px;width:100%}
h1{font-size:26px;margin:0 0 4px}h2{font-size:16px;margin:0 0 12px}.sub{color:var(--mut);margin-bottom:22px}
.grid{display:grid;gap:16px}.g4{grid-template-columns:repeat(4,1fr)}.g2{grid-template-columns:1fr 1fr}
.card{background:var(--panel);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:16px;padding:18px}
.stat b{display:block;font-size:30px;letter-spacing:-.02em}.stat span{color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.08em}
.bar{height:8px;border-radius:99px;background:#ffffff12;overflow:hidden;margin-top:10px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));border-radius:99px;transition:width .5s}
button.btn,.btn{background:linear-gradient(90deg,var(--acc),var(--acc2));color:#fff;border:0;border-radius:10px;padding:9px 16px;font:600 13px inherit;font-family:inherit;cursor:pointer;text-decoration:none;display:inline-block}
.btn:hover{filter:brightness(1.1)}.btn:disabled{opacity:.5;cursor:wait}.btn.ghost{background:#ffffff0f;border:1px solid var(--line);color:var(--tx)}.btn.sm{padding:5px 10px;font-size:12px}.btn.red{background:#f8717122;color:var(--bad);border:1px solid #f8717144}
input,textarea,select{width:100%;background:#0b0e1a;border:1px solid var(--line);color:var(--tx);border-radius:10px;padding:10px 12px;font:inherit;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--acc)}textarea{min-height:220px;resize:vertical}
label{display:block;color:var(--mut);font-size:12px;margin:12px 0 5px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.sp{flex:1}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11px;background:#ffffff12;color:var(--mut)}
.pill.ok{background:#34d39922;color:var(--ok)}.pill.warn{background:#fbbf2422;color:var(--warn)}.pill.bad{background:#f8717122;color:var(--bad)}.pill.acc{background:#7c8cff28;color:#aab4ff}
.kan{display:grid;grid-template-columns:repeat(6,minmax(170px,1fr));gap:12px;overflow-x:auto}
.col{background:#0d1120aa;border:1px solid var(--line);border-radius:14px;padding:10px;min-height:200px}
.col h3{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);margin:2px 4px 10px;display:flex;justify-content:space-between}
.kc{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px;cursor:pointer}.kc:hover{border-color:var(--acc)}
.kc b{display:block;font-size:13px}.kc small{color:var(--mut)}
.ring{--p:0;width:120px;height:120px;border-radius:50%;background:conic-gradient(var(--c,var(--acc)) calc(var(--p)*1%),#ffffff14 0);display:grid;place-items:center;flex:none}
.ring div{width:96px;height:96px;border-radius:50%;background:#0f1322;display:grid;place-items:center;font-size:30px;font-weight:800}
.sug{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;background:#0d1120}
.sug .o{background:#f8717114;border-left:3px solid var(--bad);padding:6px 10px;border-radius:6px;margin:6px 0;color:#f3c4c4}
.sug .p{background:#34d39914;border-left:3px solid var(--ok);padding:6px 10px;border-radius:6px;margin:6px 0;color:#c4f3df}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle}th{color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.08em}tr.h:hover{background:#ffffff08;cursor:pointer}
.sc{font-weight:800}.hi{color:var(--ok)}.mid{color:var(--warn)}.lo{color:var(--bad)}
iframe.prev{width:100%;height:640px;border:1px solid var(--line);border-radius:12px;background:#fff}
.tabs{display:flex;gap:6px;margin:14px 0 10px}.tabs button{background:#ffffff0c;border:1px solid var(--line);color:var(--mut);padding:6px 14px;border-radius:99px;cursor:pointer;font:inherit}.tabs button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.chart{display:flex;gap:8px;align-items:flex-end;height:120px}.chart div{flex:1;text-align:center;font-size:11px;color:var(--mut)}.chart i{display:block;background:linear-gradient(180deg,var(--acc2),var(--acc));border-radius:6px 6px 0 0;min-height:3px;margin-bottom:4px}
#toast{position:fixed;right:20px;bottom:20px;display:flex;flex-direction:column;gap:8px;z-index:50}#toast div{background:#1b2136;border:1px solid var(--line);padding:10px 16px;border-radius:12px;box-shadow:0 10px 30px #0008;max-width:380px}#toast .e{border-color:var(--bad)}
.drop{border:2px dashed var(--line);border-radius:14px;padding:22px;text-align:center;color:var(--mut)}.drop.over{border-color:var(--acc);background:#7c8cff10}
.spin{display:inline-block;width:14px;height:14px;border:2px solid #fff5;border-top-color:#fff;border-radius:50%;animation:s .7s linear infinite;vertical-align:-2px}@keyframes s{to{transform:rotate(360deg)}}
.tag{display:inline-block;margin:3px 4px 0 0;padding:2px 9px;border-radius:99px;font-size:12px}.tag.m{background:#34d39922;color:var(--ok)}.tag.x{background:#f8717122;color:var(--bad)}
@media(max-width:900px){.app{grid-template-columns:1fr}nav{position:static;height:auto;display:flex;overflow:auto}.g4,.g2{grid-template-columns:1fr 1fr}}
</style></head><body>
<div class="app">
<nav><div class="logo">🚀 JobPilot</div><div id="nav"></div></nav>
<main id="main"></main></div>
<div id="toast"></div>
<script>
const $=s=>document.querySelector(s);
const STAT=["new","saved","ready","applied","interview","offer","rejected"];
const KAN=[["new","Inbox"],["ready","Ready to apply"],["applied","Applied"],["interview","Interview"],["offer","Offer"],["rejected","Rejected"]];
let S={jobs:[],settings:{},cv:null,cover:null},view="dashboard",cur=null,sel=new Set(),tab="analysis",filter={min:0,q:"",status:""};
const api=async(p,o={})=>{const r=await fetch(p,{headers:o.body&&!(o.body instanceof FormData)?{"Content-Type":"application/json"}:{},...o,body:o.body instanceof FormData?o.body:o.body&&JSON.stringify(o.body)});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||r.statusText);return j};
const toast=(m,e)=>{const d=document.createElement("div");d.textContent=m;if(e)d.className="e";$("#toast").append(d);setTimeout(()=>d.remove(),e?7000:3500)};
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const scc=s=>s==null?"":s>=75?"hi":s>=50?"mid":"lo";
const exportPdf=(u,b)=>busy(b,async()=>{const r=await api(u,{method:"POST"});toast("PDF saved: "+r.path)});
const busy=async(b,f)=>{const t=b.innerHTML;b.disabled=true;b.innerHTML='<span class="spin"></span> Working…';try{await f()}catch(e){toast(e.message,1)}finally{b.disabled=false;b.innerHTML=t}};
async function load(){S=await api("/api/state");render()}
function nav(){const items=[["dashboard","📊","Dashboard"],["analyze","🎯","Analyze a JD"],["discover","🔎","Discover & Autopilot"],["jobs","🗂️","All jobs"],["docs","📄","My documents"],["settings","⚙️","Settings"]];
$("#nav").innerHTML=items.map(([k,i,l])=>`<button class="${view==k?"on":""}" onclick="go('${k}')">${i} ${l}</button>`).join("")}
function go(v,id){view=v;if(id){cur=id;tab="analysis"}render();window.scrollTo(0,0)}
function render(){nav();({dashboard,analyze,discover,jobs:jobsView,docs,settings,job:jobView})[view]()}
const todayN=()=>S.jobs.filter(j=>j.applied_at&&new Date(j.applied_at).toDateString()==new Date().toDateString()).length;

function dashboard(){
 const J=S.jobs,ap=J.filter(j=>j.applied_at),sc=J.filter(j=>j.score!=null),avg=sc.length?Math.round(sc.reduce((a,j)=>a+j.score,0)/sc.length):0;
 const goal=S.settings.daily_goal||10,t=todayN();
 const days=[...Array(7)].map((_,i)=>{const d=new Date();d.setDate(d.getDate()-6+i);return[d,ap.filter(j=>new Date(j.applied_at).toDateString()==d.toDateString()).length]});
 const mx=Math.max(1,...days.map(x=>x[1]));
 const ready=J.filter(j=>j.status=="ready").sort((a,b)=>b.score-a.score);
 $("#main").innerHTML=`<h1>Good ${new Date().getHours()<12?"morning":"day"} 👋</h1><div class="sub">${!S.cv?"⚠️ Start by uploading your CV in <a href='#' onclick=\"go('docs')\">My documents</a>. ":""}${!S.settings.has_key?"⚠️ Add your OpenRouter key in <a href='#' onclick=\"go('settings')\">Settings</a>.":"Your job-hunt command centre."}</div>
 <div class="grid g4"><div class="card stat"><span>Applied today</span><b>${t}/${goal}</b><div class="bar"><i style="width:${Math.min(100,t/goal*100)}%"></i></div></div>
 <div class="card stat"><span>Total applied</span><b>${ap.length}</b></div>
 <div class="card stat"><span>Interviews / offers</span><b>${J.filter(j=>["interview","offer"].includes(j.status)).length}</b></div>
 <div class="card stat"><span>Avg match score</span><b class="${scc(avg)}">${avg||"–"}</b></div></div>
 <div class="grid g2" style="margin-top:16px"><div class="card"><h2>Applications – last 7 days</h2><div class="chart">${days.map(([d,n])=>`<div><i style="height:${n/mx*90}px"></i>${n}<br>${d.toLocaleDateString(undefined,{weekday:"short"})}</div>`).join("")}</div></div>
 <div class="card"><h2>⚡ Apply queue <span class="pill acc">${ready.length} ready</span></h2>${ready.slice(0,5).map(j=>`<div class="row" style="padding:6px 0;border-bottom:1px solid var(--line)"><b class="sc ${scc(j.score)}">${j.score}</b><div class="sp"><a href="#" onclick="go('job','${j.id}')">${esc(j.title)}</a><br><small class="pill">${esc(j.company)}</small>${j.auto?' <span class="pill warn">auto-drafted · review</span>':""}</div><a class="btn sm" href="${esc(j.url)}" target="_blank" onclick="mark('${j.id}')">Apply ↗</a></div>`).join("")||'<div class="sub">Nothing ready. Run Autopilot in Discover.</div>'}
 <div style="margin-top:12px"><button class="btn ghost sm" onclick="go('discover')">Find more jobs →</button></div></div></div>
 <h2 style="margin-top:24px">Pipeline</h2><div class="kan">${KAN.map(([k,l])=>{const c=J.filter(j=>j.status==k).sort((a,b)=>(b.score||0)-(a.score||0));return`<div class="col"><h3>${l}<span>${c.length}</span></h3>${c.slice(0,30).map(j=>`<div class="kc" onclick="go('job','${j.id}')"><b>${esc(j.title||"Untitled")}</b><small>${esc(j.company)}</small>${j.score!=null?` <span class="sc ${scc(j.score)}" style="float:right">${j.score}</span>`:""}</div>`).join("")}</div>`}).join("")}</div>`}
async function mark(id){setTimeout(async()=>{if(confirm("Did you submit the application? Mark as applied?")){await api("/api/jobs/"+id,{method:"PATCH",body:{status:"applied"}});load()}},1500)}

function analyze(){
 $("#main").innerHTML=`<h1>Analyze a job description</h1><div class="sub">Paste a JD → match score → approve suggested CV edits → tailored CV + cover letter.</div>
 <div class="card"><div class="grid g2"><div><label>Job title (optional)</label><input id="t"></div><div><label>Company (optional)</label><input id="c"></div></div>
 <label>Apply URL (optional)</label><input id="u"><label>Job description</label><textarea id="jd" placeholder="Paste the full job description here…"></textarea>
 <div style="margin-top:14px"><button class="btn" id="go">🎯 Analyze match</button></div></div>`;
 $("#go").onclick=e=>busy(e.target,async()=>{const r=await api("/api/jobs",{method:"POST",body:{title:$("#t").value,company:$("#c").value,url:$("#u").value,jd:$("#jd").value,analyze:true}});await load();go("job",r.id)})}

async function jobView(){
 const j=await api("/api/jobs/"+cur).catch(()=>null);if(!j){go("jobs");return}
 const a=j.analysis,sg=a?.suggestions||[];if(a&&window._selFor!=j.id){sel=new Set(sg.map(s=>s.id));window._selFor=j.id}
 const link=k=>`/doc/job/${j.id}/${k}`;
 $("#main").innerHTML=`<div class="row"><div class="sp"><h1>${esc(j.title||"Untitled role")}</h1><div class="sub">${esc(j.company)} ${j.location?"· "+esc(j.location):""} ${j.url?`· <a href="${esc(j.url)}" target="_blank">open posting ↗</a>`:""}</div></div>
 <select style="width:auto" onchange="setSt('${j.id}',this.value)">${STAT.map(s=>`<option ${s==j.status?"selected":""}>${s}</option>`).join("")}</select>
 <button class="btn red sm" onclick="del('${j.id}')">Delete</button></div>
 ${j.error?`<div class="card" style="border-color:var(--bad)">❌ ${esc(j.error)}</div>`:""}
 <div class="tabs">${["analysis","cv","cover","jd","notes"].map(t=>`<button class="${tab==t?"on":""}" onclick="tab='${t}';jobView()">${{analysis:"Match & edits",cv:"Tailored CV",cover:"Cover letter",jd:"Job description",notes:"Notes"}[t]}</button>`).join("")}</div>
 <div id="tb"></div>`;
 const tb=$("#tb");
 if(tab=="analysis"){
  if(!a){tb.innerHTML=`<div class="card"><button class="btn" id="an">🎯 Analyze match</button></div>`;$("#an").onclick=e=>busy(e.target,async()=>{await api(`/api/jobs/${j.id}/analyze`,{method:"POST"});await load();jobView()});return}
  tb.innerHTML=`<div class="card row" style="gap:24px"><div class="ring" style="--p:${j.score};--c:var(--${j.score>=75?"ok":j.score>=50?"warn":"bad"})"><div>${j.score}</div></div><div class="sp"><h2>Match verdict</h2><p>${esc(a.verdict)}</p>
   <div>${(a.matched||[]).map(x=>`<span class="tag m">✓ ${esc(x)}</span>`).join("")}</div><div>${(a.missing||[]).map(x=>`<span class="tag x">✗ ${esc(x)}</span>`).join("")}</div>
   <small class="sub">Match score = skills only. Red skills are not in your CV – JobPilot will never add them for you.</small></div></div>
  <h2 style="margin-top:22px">Suggested CV changes <span class="pill">${sg.length}</span>${a.dropped_unsafe?` <span class="pill warn">${a.dropped_unsafe} unsafe suggestion(s) auto-rejected</span>`:""}</h2>
  ${sg.map(s=>`<div class="sug"><label class="row" style="margin:0;color:var(--tx);cursor:pointer"><input type="checkbox" style="width:auto" ${sel.has(s.id)?"checked":""} onchange="this.checked?sel.add(${s.id}):sel.delete(${s.id})"> <b>${esc(s.section||"CV")}</b></label>
   <div class="o">− ${esc(s.original.replace(/<[^>]+>/g,""))}</div><div class="p">+ ${esc(s.proposed)}</div><small class="sub">${esc(s.reason)}</small></div>`).join("")||'<div class="sub">No safe edits needed – your CV already fits.</div>'}
  <div class="row" style="margin-top:14px"><button class="btn" id="gen">✅ Approve selected → build CV + cover letter</button><button class="btn ghost" onclick="sel=new Set(${JSON.stringify(sg.map(s=>s.id))});jobView()">Select all</button><button class="btn ghost" onclick="sel=new Set();jobView()">None</button></div>`;
  $("#gen").onclick=e=>busy(e.target,async()=>{await api(`/api/jobs/${j.id}/generate`,{method:"POST",body:{accepted:[...sel]}});await load();tab="cv";jobView();toast("Documents ready")})}
 else if(tab=="cv"||tab=="cover"){const k=tab;
  if(!j.has_docs){tb.innerHTML='<div class="card sub">Approve edits in “Match & edits” to generate this.</div>';return}
  tb.innerHTML=`${j.auto?'<div class="pill warn" style="margin-bottom:8px">Auto-drafted by Autopilot – please review before applying</div>':""}
   ${j.warnings_list?.map(w=>`<div class="card" style="border-color:var(--warn);margin-bottom:10px">⚠️ ${esc(w)}</div>`).join("")||""}
   <div class="row" style="margin-bottom:10px"><button class="btn sm" onclick="exportPdf('/api/export/job/${j.id}/${k}',this)">⬇️ Save as PDF</button><a class="btn ghost sm" target="_blank" href="${link(k)}">Open</a><div class="sp"></div>${j.url?`<a class="btn sm" target="_blank" href="${esc(j.url)}" onclick="mark('${j.id}')">Apply on site ↗</a>`:""}</div>
   <iframe class="prev" sandbox src="${link(k)}"></iframe>`}
 else if(tab=="jd")tb.innerHTML=`<div class="card" style="white-space:pre-wrap">${esc(j.jd)}</div>`;
 else{tb.innerHTML=`<div class="card"><textarea id="nt" style="min-height:160px">${esc(j.notes)}</textarea><div style="margin-top:10px"><button class="btn" id="sv">Save notes</button></div></div>`;$("#sv").onclick=async()=>{await api("/api/jobs/"+j.id,{method:"PATCH",body:{notes:$("#nt").value}});toast("Saved")}}
}
const setSt=async(id,s)=>{await api("/api/jobs/"+id,{method:"PATCH",body:{status:s}});await load();toast("Status → "+s)};
const del=async id=>{if(confirm("Delete this job?")){await api("/api/jobs/"+id,{method:"DELETE"});await load();go("jobs")}};

let poll=null;
function discover(){
 const pend=S.jobs.filter(j=>j.busy).length,unsc=S.jobs.filter(j=>!j.has_analysis&&j.status=="new").length;
 $("#main").innerHTML=`<h1>Discover & Autopilot</h1><div class="sub">Pulls fresh postings (Remotive, Arbeitnow), scores each against your CV, and — for matches above ${S.settings.auto_threshold}% — drafts a tailored CV + cover letter for you to review and apply.</div>
 <div class="card"><div class="row"><input id="q" style="flex:1;min-width:240px" placeholder="e.g. data analyst, rust developer, product manager" value="${esc(S.settings.default_query)}"><button class="btn" id="ap">🚀 Run Autopilot</button><button class="btn ghost" id="sa">Score unscored (${unsc})</button></div>
 <small class="sub">${pend?`<span class="spin"></span> ${pend} job(s) being processed… the list updates automatically.`:"Tip: run it a few times a day with different keywords."}</small></div>
 <div id="list" style="margin-top:18px"></div>`;
 $("#ap").onclick=e=>busy(e.target,async()=>{await api("/api/autopilot",{method:"POST",body:{query:$("#q").value}});toast("Autopilot started – results appear below");startPoll()});
 $("#sa").onclick=async()=>{await api("/api/score-all",{method:"POST"});toast("Scoring started");startPoll()};
 listJobs($("#list"),true);if(pend)startPoll()}
function startPoll(){clearInterval(poll);let n=0;poll=setInterval(async()=>{if(!["discover","jobs","dashboard"].includes(view)){clearInterval(poll);return}S=await api("/api/state");const act=S.jobs.some(j=>j.busy);if(view=="discover"){const l=$("#list");if(l)listJobs(l,true)}else render();if(++n>3&&!act&&n>12)clearInterval(poll)},2500)}
function listJobs(el,discoverMode){
 let L=S.jobs.filter(j=>(j.score||0)>=filter.min||(j.score==null&&filter.min==0));
 if(filter.q)L=L.filter(j=>(j.title+j.company).toLowerCase().includes(filter.q.toLowerCase()));
 if(filter.status)L=L.filter(j=>j.status==filter.status);
 L.sort((a,b)=>(b.score??-1)-(a.score??-1));
 el.innerHTML=`<div class="card"><div class="row" style="margin-bottom:10px"><input style="max-width:240px" placeholder="Search…" value="${esc(filter.q)}" oninput="filter.q=this.value;listJobs(this.closest('.card').parentElement,${discoverMode})">
 <select style="width:auto" onchange="filter.min=+this.value;listJobs(this.closest('.card').parentElement,${discoverMode})">${[0,50,65,75,85].map(v=>`<option value="${v}" ${filter.min==v?"selected":""}>Score ≥ ${v}</option>`).join("")}</select>
 <select style="width:auto" onchange="filter.status=this.value;listJobs(this.closest('.card').parentElement,${discoverMode})"><option value="">All statuses</option>${STAT.map(s=>`<option ${filter.status==s?"selected":""}>${s}</option>`).join("")}</select><span class="pill">${L.length} jobs</span></div>
 <table><tr><th>Score</th><th>Role</th><th>Company</th><th>Source</th><th>Status</th><th></th></tr>${L.slice(0,200).map(j=>`<tr class="h" onclick="go('job','${j.id}')"><td class="sc ${scc(j.score)}">${j.busy?'<span class="spin"></span>':j.score??"–"}</td><td>${esc(j.title)}${j.auto?' <span class="pill warn">auto-draft</span>':""}${j.error?' <span class="pill bad">error</span>':""}</td><td>${esc(j.company)}</td><td><span class="pill">${esc(j.source)}</span></td><td><span class="pill ${j.status=="ready"?"ok":j.status=="applied"?"acc":""}">${j.status}</span></td>
 <td onclick="event.stopPropagation()">${j.url?`<a class="btn sm" href="${esc(j.url)}" target="_blank" onclick="mark('${j.id}')">Apply ↗</a>`:""}</td></tr>`).join("")||'<tr><td colspan=6 class="sub">No jobs yet.</td></tr>'}</table></div>`}
function jobsView(){$("#main").innerHTML=`<h1>All jobs</h1><div class="sub">Every posting you've pasted or discovered.</div><div id="list"></div>`;listJobs($("#list"))}

function docs(){
 const box=(k,l,d)=>`<div class="card"><h2>${l} ${d?`<span class="pill ok">${esc(d.name)}</span>`:'<span class="pill warn">missing</span>'}</h2>
 <div class="drop" id="dz-${k}">Drop a PDF here or <label class="btn sm" style="display:inline-block;margin:0">choose file<input type="file" accept=".pdf" hidden id="f-${k}"></label><br><small>Converted to HTML and stored locally. Re-upload anytime to replace.</small></div>
 ${d?`<div class="row" style="margin:12px 0"><a class="btn ghost sm" target="_blank" href="/doc/base/${k}">Open</a><button class="btn ghost sm" onclick="exportPdf('/api/export/base/${k}',this)">Save as PDF</button></div><iframe class="prev" sandbox src="/doc/base/${k}" style="height:520px"></iframe>`:""}</div>`;
 $("#main").innerHTML=`<h1>My documents</h1><div class="sub">Your CV is the single source of truth. Your old cover letter is the style template.</div><div class="grid g2">${box("cv","CV",S.cv)}${box("cover","Cover letter",S.cover)}</div>`;
 for(const k of["cv","cover"]){const up=async f=>{if(!f)return;const el=$("#dz-"+k);el.innerHTML='<span class="spin"></span> Converting PDF → HTML…';const fd=new FormData();fd.append("file",f);try{await api("/api/docs/"+k,{method:"POST",body:fd});toast("Uploaded");await load()}catch(e){toast(e.message,1);render()}};
  $("#f-"+k).onchange=e=>up(e.target.files[0]);const dz=$("#dz-"+k);dz.ondragover=e=>{e.preventDefault();dz.classList.add("over")};dz.ondragleave=()=>dz.classList.remove("over");dz.ondrop=e=>{e.preventDefault();up(e.dataTransfer.files[0])}}}

function settings(){const s=S.settings;
 $("#main").innerHTML=`<h1>Settings</h1><div class="sub">Everything runs locally; only text is sent to OpenRouter.</div><div class="card" style="max-width:640px">
 <label>OpenRouter API key ${s.has_key?'<span class="pill ok">saved</span>':'<span class="pill bad">not set</span>'}</label><input id="k" type="password" placeholder="sk-or-… (leave blank to keep current)">
 <label>Model</label><input id="m" value="${esc(s.model)}"><small class="sub">Default: deepseek/deepseek-v4-flash (any OpenRouter model id works)</small>
 <label>Daily application goal</label><input id="g" type="number" value="${s.daily_goal}">
 <label class="row" style="color:var(--tx)"><input type="checkbox" id="ap" style="width:auto" ${s.auto_prepare?"checked":""}> Autopilot auto-drafts CV + cover letter for strong matches</label>
 <label>Auto-draft threshold (score ≥)</label><input id="th" type="number" min="0" max="100" value="${s.auto_threshold}">
 <div style="margin-top:16px"><button class="btn" id="sv">Save</button></div></div>`;
 $("#sv").onclick=e=>busy(e.target,async()=>{await api("/api/settings",{method:"PUT",body:{api_key:$("#k").value,model:$("#m").value,daily_goal:+$("#g").value,auto_prepare:$("#ap").checked,auto_threshold:+$("#th").value}});await load();toast("Saved")})}
load();
</script></body></html>
